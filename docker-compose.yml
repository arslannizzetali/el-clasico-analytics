# Local PostgreSQL for the league-wide data:  docker compose up -d
name: clasico
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: clasico
      POSTGRES_PASSWORD: clasico
      POSTGRES_DB: clasico
    ports:
      - "${PGPORT:-5434}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clasico -d clasico"]
      interval: 2s
      retries: 30

volumes:
  pgdata:
