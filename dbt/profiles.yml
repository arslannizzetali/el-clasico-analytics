# Connection from environment variables, defaulting to the docker-compose database (localhost:5434).
# CI sets PGPORT=5432 for its PostgreSQL service.
clasico:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('PGHOST', 'localhost') }}"
      port: "{{ env_var('PGPORT', '5434') | as_number }}"
      user: "{{ env_var('PGUSER', 'clasico') }}"
      password: "{{ env_var('PGPASSWORD', 'clasico') }}"
      dbname: "{{ env_var('PGDATABASE', 'clasico') }}"
      schema: analytics
      threads: 4
