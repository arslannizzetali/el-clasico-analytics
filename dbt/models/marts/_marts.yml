version: 2

models:
  - name: dim_matches
    description: One row per match with team names and the categories it belongs to.
    columns:
      - name: match_id
        data_tests: [unique, not_null]
  - name: fct_match_team
    description: >
      One row per team per match. Counting metrics of the reference pipeline (scripts/build.py) in SQL;
      tests/test_dbt.py checks them against data/processed/match_team.csv on the Clásicos.
    columns:
      - name: match_team_key
        data_tests: [unique, not_null]
      - name: match_id
        data_tests:
          - not_null
          - relationships: {arguments: {to: ref('dim_matches'), field: match_id}}
      - name: team_id
        data_tests:
          - not_null
          - relationships: {arguments: {to: ref('stg_teams'), field: team_id}}
      - name: venue
        data_tests:
          - accepted_values: {arguments: {values: ['Home', 'Away']}}
      - name: points
        data_tests:
          - accepted_values: {arguments: {values: [0, 1, 3], quote: false}}
      - name: ppda
        data_tests: [not_null]
